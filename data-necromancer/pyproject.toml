[project]
name = "data-necromancer"
version = "0.1.0"
description = "Autonomous metadata investigation & knowledge resurrection engine for DataHub — resurrects undocumented assets and exposes zombie metadata."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Data Necromancer contributors" }]
keywords = ["datahub", "mcp", "metadata", "data-catalog", "agent", "governance"]

dependencies = [
    "acryl-datahub>=0.15.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
agent = ["datahub-agent-context>=0.1.0", "anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
necromancer = "necromancer.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
